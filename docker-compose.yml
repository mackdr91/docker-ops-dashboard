# Date: 2026-11-15
# Description: Docker Compose orchestration mounting the host Docker socket for local development and monitoring.

services:
  dashboard:
    build:
      context: .
      target: dev
    container_name: cyber-docker-dashboard
    ports:
      - "3080:3080"
    environment:
      - NODE_ENV=development
      - PORT=3080
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
